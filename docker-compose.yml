services:
  mysql:
    image: mysql:8.0.33
    container_name: yisu-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "yisu_db"
      TZ: "Asia/Shanghai"
    ports:
      - "3306:3306"
    volumes:
      - yisu_mysql_data:/var/lib/mysql
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro

volumes:
  yisu_mysql_data:
