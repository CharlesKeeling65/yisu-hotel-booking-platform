services:
  mysql:
    image: mysql:8.0.33
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yisu_db}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - yisu_mysql_data:/var/lib/mysql
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-yisu_db}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      GEO_PROVIDER_MODE: ${GEO_PROVIDER_MODE:-auto}
      GEO_TIMEOUT_MS: ${GEO_TIMEOUT_MS:-4500}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  mobile-web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
      args:
        EXPO_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - mobile-web
      - api
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/certs:/etc/nginx/certs:ro

volumes:
  yisu_mysql_data:
