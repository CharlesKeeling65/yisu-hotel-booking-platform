server_tokens off;

upstream api_upstream {
  server api:3000;
}

upstream web_upstream {
  server web:80;
}

upstream mobile_upstream {
  server mobile-web:80;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# HTTP: web redirects to HTTPS (for secure-context features)
server {
  listen 80;
  server_name yisuhotels.dpdns.org;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTP: mobile web remains available (convenient for assignment testing)
server {
  listen 80;
  server_name m.yisuhotels.dpdns.org;

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://mobile_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# HTTP: API remains available for local mobile debugging and fallback access
server {
  listen 80;
  server_name api.yisuhotels.dpdns.org;

  location / {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# HTTPS: web
server {
  listen 443 ssl http2;
  server_name yisuhotels.dpdns.org;

  ssl_certificate     /etc/nginx/ssl/selfsigned.fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/selfsigned.privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

